<html lang="en">
<head>
<meta charset="utf-8"/>
<title>NavBridge Trip Timeline — route + announcements</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0}
  #drop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1000;
    background:#0f172a;color:#94a3b8;font-size:18px;cursor:pointer;text-align:center;padding:20px}
  #drop.drag{background:#1e293b;color:#fff}
  #app{display:none;height:100%}

  #stats{padding:10px 14px;border-bottom:1px solid #334155;font-size:13px;color:#94a3b8}
  #stats b{color:#e2e8f0}
  #timeline{flex:1;overflow-y:auto;padding:6px 8px}
  .row{display:flex;gap:8px;padding:7px 8px;border-radius:8px;margin-bottom:4px;cursor:pointer;
    background:#1e293b;border:1px solid #334155;font-size:12.5px}
  .row:hover{background:#26334a}
  .row.sel{outline:2px solid #60a5fa}
  .t{color:#64748b;font-variant-numeric:tabular-nums;white-space:nowrap;width:58px}
  .badge{flex:none;padding:1px 7px;border-radius:10px;font-size:10.5px;font-weight:600;color:#0b1220;height:fit-content}
  .txt{color:#e2e8f0;line-height:1.35}
  #map{position:absolute;inset:0 0 0 360px}
  .legend{position:absolute;bottom:14px;left:374px;z-index:600;background:#0f172ae8;padding:8px 10px;
    border-radius:8px;border:1px solid #334155;font-size:11px;color:#cbd5e1}
  .legend span{display:inline-flex;align-items:center;margin-right:10px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px}
  @media(max-width:720px){#sidebar{width:100%;height:45%}#map{inset:45% 0 0 0}.legend{left:10px}}
</style>
</head>
<body>
<div id="drop">Click or drop a <b>Records.json</b> trip file here<br>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const KIND = {
  maneuver:'#3b82f6', overspeed:'#ef4444', limit:'#f59e0b', gps:'#a855f7',
  camera:'#f97316', rain:'#0ea5e9', sign:'#22c55e', voice:'#94a3b8'
};
const KIND_LABEL = {
  maneuver:'Rẽ/hướng dẫn', overspeed:'Quá tốc độ', limit:'Giới hạn', gps:'GPS yếu',
  camera:'Camera', rain:'Mưa', sign:'Biển báo', voice:'Khác'
};

function speedColor(kmh){
  if(kmh <= 5) return '#475569';
  const t = Math.min(1, kmh/60);
  const r = Math.round(255*Math.min(1, t*2));
  const g = Math.round(255*Math.min(1, 2 - 2*t));
  return `rgb(${r},${g},40)`;
}

let map;
function initMap(){
  map = L.map('map').setView([10.79, 106.64], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);
  return map;
}

const drop = document.getElementById('drop');
drop.addEventListener('click', ()=> document.createElement('input'))
document.addEventListener('DOMContentLoaded', ()=>{
  const input = document.createElement('input');
  input.type='file'; input.accept='.json,application/json'; input.style.display='none';
  document.body.appendChild(input);
  drop.addEventListener('click', ()=> input.click());
  input.addEventListener('change', e=>{ if(e.target.files[0]) loadFile(e.target.files[0]); });
  ['dragover','dragenter'].forEach(ev=> drop.addEventListener(ev, e=>{e.preventDefault();drop.classList.add('drag');}));
  ['dragleave','drop'].forEach(ev=> drop.addEventListener(ev, e=>{e.preventDefault();drop.classList.remove('drag');}));
  drop.addEventListener('drop', e=>{ const f=e.dataTransfer.files[0]; if(f) loadFile(f); });
});

function loadFile(file){
  const rd = new FileReader();
  rd.onload = ()=>{ try{ render(JSON.parse(rd.result)); }catch(err){ alert('Not a valid trip JSON: '+err.message); } };
  rd.readAsText(file);
}

function render(d){
  const locs = (d.locations||[]).map(l=>({
    lat: l.latitudeE7/1e7, lng: l.longitudeE7/1e7,
    kmh: (l.velocity||0)*3.6,
    t: new Date(parseInt(l.timestampMs)),
    street: l.street||'', highway: l.highway||'', limit: l.speedLimit||''
  }));
  const ann = (d.announcements||[]).map(a=>({
    lat:a.lat, lng:a.lng, kind:a.kind||'voice', text:a.text||'', t:new Date(a.time)
  }));

  document.getElementById('drop').style.display='none';
  document.getElementById('app').style.display='block';
  if(!map) initMap();

  // --- stats ---
  let maxKmh=0; for(const l of locs) maxKmh=Math.max(maxKmh,l.kmh);
  const dur = locs.length>1 ? (locs[locs.length-1].t - locs[0].t)/60000 : 0;
  document.getElementById('stats').innerHTML =
    `<b>${locs.length}</b> fixes · <b>${ann.length}</b> announcements<br>`+
    `max <b>${maxKmh.toFixed(0)}</b> km/h · <b>${dur.toFixed(1)}</b> min · `+
    `${(d.places||[]).length} places`;

  // --- route (speed-colored segments) ---
  for(let i=1;i<locs.length;i++){
    const a=locs[i-1], b=locs[i];
    L.polyline([[a.lat,a.lng],[b.lat,b.lng]], {color:speedColor(b.kmh), weight:4, opacity:0.9}).addTo(map);
  }
  if(locs.length){
    L.circleMarker([locs[0].lat,locs[0].lng], {radius:7,color:'#fff',fillColor:'#22c55e',fillOpacity:1,weight:2})
      .addTo(map).bindTooltip('Start');
    L.circleMarker([locs[locs.length-1].lat,locs[locs.length-1].lng], {radius:7,color:'#fff',fillColor:'#ef4444',fillOpacity:1,weight:2})
      .addTo(map).bindTooltip('End');
  }

  // --- announcement markers ---
  const markers = [];
  for(const a of ann){
    const m = L.circleMarker([a.lat,a.lng], {
      radius:7, color:'#0b1220', weight:2, fillColor:KIND[a.kind]||KIND.voice, fillOpacity:1
    }).addTo(map);
    m.bindPopup(`<b>${KIND_LABEL[a.kind]||a.kind}</b><br>${a.t.toLocaleTimeString()}<br>${a.text}`);
    markers.push({a, m});
  }

  // --- timeline panel ---
  const tl = document.getElementById('timeline');
  tl.innerHTML='';
  ann.forEach((a,i)=>{
    const r = document.createElement('div');
    r.className='row';
    const color = KIND[a.kind]||KIND.voice;
    r.innerHTML =
      `<div class="t">${a.t.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}</div>`+
      `<div class="badge" style="background:${color}">${KIND_LABEL[a.kind]||a.kind}</div>`+
      `<div class="txt">${a.text}</div>`;
    r.onclick = ()=>{
      document.querySelectorAll('.row').forEach(x=>x.classList.remove('sel'));
      r.classList.add('sel');
      map.flyTo([a.lat,a.lng], Math.max(map.getZoom(),17), {duration:0.5});
      markers[i].m.openPopup();
    };
    tl.appendChild(r);
  });
  if(!ann.length) tl.innerHTML='<div style="color:#64748b;padding:10px">No announcements in this file.</div>';

  // --- legend ---
  document.getElementById('legend').innerHTML =
    Object.entries(KIND_LABEL).map(([k,lab])=>
      `<span><span class="dot" style="background:${KIND[k]}"></span>${lab}</span>`).join('');

  // fit to route
  if(locs.length) map.fitBounds([[locs[0].lat,locs[0].lng],[locs[locs.length-1].lat,locs[locs.length-1].lng]], {padding:[40,40]});
}

// Auto-render when the trip JSON is embedded in this file (self-contained view).
if (typeof TRIP_DATA !== 'undefined') render(TRIP_DATA);
</script>
</body>
</html>
