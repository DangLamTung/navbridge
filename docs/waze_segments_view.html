 vào Trường Chinh. Tốc độ tối đa 50 km/h.", "lat": 10.79948, "lng": 106.64052}, {"t": "01:46:16", "k": "maneuver", "x": "quay đầu vào Trường Chinh, sau đó rẽ phải vào Hẻm 508 Trường Chinh. Tốc độ tối đa 50 km/h.", "lat": 10.79969, "lng": 106.64075}, {"t": "01:46:16", "k": "camera", "x": "Camera giám sát giao thông ngay phía trước", "lat": 10.79969, "lng": 106.64075}, {"t": "01:46:23", "k": "maneuver", "x": "quay đầu vào Trường Chinh, sau đó rẽ phải vào Hẻm 508 Trường Chinh. Tốc độ tối đa 60 km/h.", "lat": 10.79961, "lng": 106.64081}, {"t": "01:46:25", "k": "limit", "x": "Giới hạn 60 km/h", "lat": 10.7996, "lng": 106.64092}, {"t": "01:46:30", "k": "maneuver", "x": "rẽ phải vào Trường Chinh, sau đó rẽ phải vào Hẻm 508 Trường Chinh. Tốc độ tối đa 60 km/h.", "lat": 10.79983, "lng": 106.64111}, {"t": "01:46:30", "k": "camera", "x": "Camera đèn đỏ ngay phía trước", "lat": 10.79983, "lng": 106.64111}, {"t": "01:46:36", "k": "maneuver", "x": "rẽ trái. Tốc độ tối đa 60 km/h.", "lat": 10.80015, "lng": 106.64142}, {"t": "01:46:36", "k": "camera", "x": "Camera giám sát giao thông phía trước 113 mét", "lat": 10.80015, "lng": 106.64142}, {"t": "01:46:43", "k": "maneuver", "x": "Đi trên Tiến lên, sau 304 mét, rẽ trái. Tốc độ tối đa 60 km/h.", "lat": 10.80062, "lng": 106.6414}, {"t": "01:46:49", "k": "maneuver", "x": "Đi trên Ấp Bắc, sau 194 mét, rẽ trái vào Cộng Hòa, sau đó quay đầu vào Cộng Hòa. Tốc độ tối đa 60 km/h.", "lat": 10.80076, "lng": 106.64139}, {"t": "01:46:51", "k": "camera", "x": "Camera giám sát giao thông phía trước 166 mét", "lat": 10.80092, "lng": 106.64149}, {"t": "01:46:58", "k": "maneuver", "x": "Đi trên Ấp Bắc, sau 181 mét, rẽ trái vào Cộng Hòa, sau đó quay đầu vào Cộng Hòa. Tốc độ tối đa 50 km/h.", "lat": 10.80095, "lng": 106.64134}, {"t": "01:47:00", "k": "limit", "x": "Giới hạn 50 km/h", "lat": 10.80095, "lng": 106.64134}, {"t": "01:47:11", "k": "gps", "x": "Tín hiệu GPS yếu, vị trí có thể không chính xác.", "lat": 10.80092, "lng": 106.64119}]};
const COLOURS = {"20": "#7b1fa2", "30": "#512da8", "40": "#1976d2", "50": "#2e7d32", "60": "#f9a825", "70": "#ef6c00", "80": "#e64a19", "90": "#c62828", "100": "#8e0000", "120": "#111111"};
function colour(f,r){
  const v = Math.max(f||0, r||0);
  let c = '#9e9e9e';
  for (const k of Object.keys(COLOURS).map(Number).sort((a,b)=>a-b)) {
    if (v >= k) c = COLOURS[k];
  }
  return c;
}
const map = L.map('map', {preferCanvas:true}).setView([10.7946,106.6385], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);

const layers = [];
let layersByLimit = {};
for (const s of SEGS){
  const v = Math.max(s.f||0, s.r||0);
  const bucket = v < 20 ? -1 : (Object.keys(COLOURS).map(Number)
      .filter(k=>v>=k).sort((a,b)=>b-a)[0] ?? -1);
  const pl = L.polyline(s.p, {color: colour(s.f,s.r), weight: 4, opacity:.85});
  let len = 0;
  for (let i=1;i<s.p.length;i++){
    const dy=(s.p[i][0]-s.p[i-1][0])*111320;
    const dx=(s.p[i][1]-s.p[i-1][1])*111320*Math.cos(s.p[i][0]*Math.PI/180);
    len += Math.hypot(dx,dy);
  }
  pl.bindPopup(`<div class="pop"><b>${Math.max(s.f||0,s.r||0)} km/h</b>
    <table>
      <tr><td>chiều thuận (fwd)</td><td>${s.f||'—'}</td></tr>
      <tr><td>chiều ngược (rev)</td><td>${s.r||'—'}</td></tr>
      <tr><td>dài</td><td>${len.toFixed(0)} m</td></tr>
      <tr><td>điểm</td><td>${s.p.length}</td></tr>
    </table></div>`);
  pl._lim = bucket; pl._diff = (s.f!==s.r);
  layers.push(pl);
  (layersByLimit[bucket] ||= []).push(pl);
}
const group = L.layerGroup(layers).addTo(map);

let tripLayer = null;
function drawTrip(){
  if (tripLayer){ map.removeLayer(tripLayer); tripLayer=null; }
  if (!TRIP || !document.getElementById('showTrip').checked) return;
  const g = L.layerGroup();
  L.polyline(TRIP.route, {color:'#1565c0', weight:3, dashArray:'6,4', opacity:.9}).addTo(g);
  for (const a of TRIP.ann){
    L.circleMarker([a.lat,a.lng], {radius:5, color:'#fff', weight:1,
      fillColor: a.k==='maneuver'?'#00bcd4': a.k==='camera'?'#ff5722':'#4caf50',
      fillOpacity:.95}).bindPopup(`<b>${a.t}</b><br>${a.k}<br>${a.x}`).addTo(g);
  }
  tripLayer = g.addTo(map);
}
drawTrip();

function apply(){
  const on = new Set([...document.querySelectorAll('.lim:checked')].map(e=>+e.value));
  const onlyDiff = document.getElementById('onlyDiff').checked;
  let shown=0;
  for (const l of layers){
    const vis = on.has(l._lim) && (!onlyDiff || l._diff);
    if (vis){ if(!group.hasLayer(l)) group.addLayer(l); shown++; }
    else if (group.hasLayer(l)) group.removeLayer(l);
  }
  document.getElementById('stat').textContent =
    `${shown} / ${layers.length} segments shown`;
}
document.querySelectorAll('.lim, #onlyDiff').forEach(e=>e.addEventListener('change', apply));
document.getElementById('showTrip').addEventListener('change', drawTrip);
apply();

if (TRIP && TRIP.route.length){
  map.fitBounds(L.latLngBounds(TRIP.route).pad(0.35));
}
</script>
