name: navbridge
description: "BLE portable turn-by-turn navigation that mirrors directions to an external e-ink monitor."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Map + tiles from OpenStreetMap (no API key needed)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # GPS position + permission
  geolocator: ^12.0.0
  permission_handler: ^11.0.0
  # BLE client for the E-ink clock
  flutter_blue_plus: ^1.32.0
  # OSRM routing + Nominatim search
  http: ^1.2.0
  # Trip logging (Google Takeout Records.json) + share/export
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  # Online/offline detection (offline mode)
  connectivity_plus: ^6.1.0
  # Voice commands (Android speech recognition) + spoken turn-by-turn guidance
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  cupertino_icons: ^1.0.8
  maplibre_gl: ^0.26.2
  vietmap_flutter_navigation: ^4.2.0
  # Vietmap's own LatLng/Point types (used by the navigation SDK calls).
  vietmap_gl_platform_interface: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Offline vector navigation map (style + fonts + sprite + tiles; the
    # .pmtiles / fonts / sprite are copied into app storage at first use so
    # MapLibre can read them from file:// paths).
    # NOTE: Flutter does NOT recurse into subdirectories — each dir that
    # contains files must be listed.
    - assets/offline_map/
    - assets/offline_map/icons/
    - assets/offline_map/sprite/
    - assets/offline_map/fonts/
    - assets/offline_map/fonts/Roboto Regular/
    - assets/offline_map/fonts/Roboto Medium/
    - assets/offline_map/fonts/Roboto Condensed Italic/
