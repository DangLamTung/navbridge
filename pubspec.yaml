name: navbridge
description: "BLE portable turn-by-turn navigation that mirrors directions to an external e-ink monitor."
publish_to: 'none'
# Build 2002: the phone already carries an install with versionCode 2001
# (from an earlier sideload), so the code must stay above it or Android
# rejects the install as a downgrade.
version: 1.0.0+2002

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Map + tiles from OpenStreetMap (no API key needed)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # GPS position + permission
  flutter_overlay_window: ^0.5.0
  geolocator: ^12.0.0
  # Android-specific GPS stream settings (intervalDuration — without it
  # geolocator_android defaults to a 5 s fix interval, which makes the
  # navigation map feel like it 'runs too slow').
  geolocator_android: ^4.6.2
  permission_handler: ^11.0.0
  # BLE client for the E-ink clock
  flutter_blue_plus: ^1.32.0
  # OSRM routing + Nominatim search
  http: ^1.2.0
  # Trip logging (Google Takeout Records.json) + share/export
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  # Online/offline detection (offline mode)
  connectivity_plus: ^6.1.0
  # Voice commands (Android speech recognition) + spoken turn-by-turn guidance
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  cupertino_icons: ^1.0.8
  maplibre_gl: ^0.26.2
  # Keep the screen on while navigating (prevents the MapLibre GL surface
  # being torn down / going black when the itel screen sleeps).
  wakelock_plus: ^1.2.10
  # Open the Wikipedia / website links on the POI info card.
  url_launcher: ^6.3.0
  # Real Vietmap turn-by-turn navigation (official Vietmap Flutter SDK —
  # wraps the native Vietmap navigation AARs; needs VIETMAP_API_KEY).
  vietmap_flutter_navigation: ^4.2.0
  # Keep navigation alive in the background (Google-Maps style foreground
  # service + live notification) while the app is backgrounded / screen off.
  flutter_foreground_task: ^8.12.0
  # Heads-up turn-by-turn banner notifications ("only notify when needed").
  flutter_local_notifications: ^17.2.0
  # CCTV camera icon (bundled SVG asset, rendered via flutter_svg).
  flutter_svg: ^1.1.6
  # Encrypted on-device storage for AI API keys (Android Keystore / iOS
  # Keychain). Keys are never kept in the APK — users paste them once and
  # they're encrypted at rest.
  flutter_secure_storage: ^9.2.2
  archive: ^4.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Offline vector navigation map (style + fonts + sprite + tiles).
    # The HCMC z16 nav-map TILES are BUNDLED so navigation (route + arrow +
    # terrain) works out-of-the-box on a fresh install. Other regions are
    # downloaded on demand (offline screen, --dart-define=NAVMAP_URL).
    # Flutter does NOT recurse into subdirectories — each dir with files must
    # be listed.
    - assets/offline_map/manifest.json
    - assets/offline_map/nav_style.json
    - assets/offline_map/saigon_z16.pmtiles
    - assets/offline_map/vietnam_places.json
    - assets/offline_map/vietnam_pois.json
    - assets/offline_map/vietnam_cameras.json
    - assets/offline_map/vietnam_signs.json
    - assets/offline_map/vietnam_speed_limits.geojson
    - assets/offline_map/icons/
    - assets/offline_map/sprite/
    - assets/offline_map/fonts/
    - assets/offline_map/fonts/Roboto Regular/
    - assets/offline_map/fonts/Roboto Medium/
    - assets/offline_map/fonts/Roboto Condensed Italic/
    # AI assistant system prompt (editable, see assets/ai/system_prompt.txt).
    - assets/ai/
