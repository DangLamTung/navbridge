# CI for navbridge — runs the analyzer and the unit tests on every push/PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The two local-only data packs (offline_map/waze_segments.bin and
      # assets/audio/**) are deliberately not in git; without them the asset
      # bundle fails to build. CI only needs the paths to exist.
      - name: Stub local-only data packs
        run: ./tool/stub_assets.sh

      - name: Install dependencies
        run: flutter pub get

      # ONE definition of the gate: `tool/check.sh` runs the analyzer and then
      # the two test lines separately — FUNCTION (test/func: trip, long trip,
      # in/out resident, signs, packs) and UNIT (test/unit). A bare
      # `flutter test` would run both in one blob and hide which line failed.
      - name: Analyze + function tests + unit tests
        run: ./tool/check.sh
