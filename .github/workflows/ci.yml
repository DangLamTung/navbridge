# CI for navbridge — runs the analyzer and the unit tests on every push/PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The two local-only data packs (offline_map/waze_segments.bin and
      # assets/audio/**) are deliberately not in git; without them the asset
      # bundle fails to build. CI only needs the paths to exist.
      - name: Stub local-only data packs
        run: ./tool/stub_assets.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
